[project]
name = "lerobot-reward-robojev"
version = "0.1.0"
description = "RoboJev for LeRobot: rewards a robot when it completes its task"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["lerobot", "requests", "pillow", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lerobot_reward_robojev"]
